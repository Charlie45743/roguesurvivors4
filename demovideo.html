<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rogue Survivors 3 Trailer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --void: #0b0a12; --ink: #f2eee6; --dim: #a59cc4; --ember: #e8742c; --gold: #ffd35a; --red: #d8354a; --blood: #7a1a2a;
  --head: 'Silkscreen', 'Courier New', monospace; --body: 'Pixelify Sans', 'Courier New', monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--body); overflow: hidden; }
#frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
.slot { position: absolute; inset: 0; opacity: 0; }
.slot.on { opacity: 1; z-index: 1; }
.slot iframe { position: absolute; top: 0; height: 100%; width: 100%; border: 0; background: var(--void); }
.slot.split iframe { width: 50%; } .slot.split iframe + iframe { left: 50%; }
.slot.split::after { content: ''; position: absolute; top: 0; bottom: 0; left: calc(50% - 2px); width: 4px; background: #000; }
#shield { position: absolute; inset: 0; z-index: 5; }
#flash { position: absolute; inset: 0; z-index: 6; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .22s ease-out; }
@keyframes flash { from { opacity: .85; } to { opacity: 0; } }
#frame.shake { animation: shake .25s steps(4); }
@keyframes shake { 25% { transform: translate(calc(-50% - 6px), calc(-50% + 4px)); } 50% { transform: translate(calc(-50% + 5px), calc(-50% - 3px)); } 75% { transform: translate(calc(-50% - 3px), calc(-50% - 2px)); } }
/* Slam titles */
#title { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; pointer-events: none; text-align: center; padding: 0 20px; }
#title .h { font-family: var(--head); font-weight: 700; font-size: clamp(30px, 7.5vw, 104px); line-height: .95; letter-spacing: 3px; color: var(--ink);
  text-shadow: 0 5px 0 var(--blood), 0 10px 0 #000, 0 0 40px rgba(0,0,0,.95); }
#title .h.gold { color: var(--gold); text-shadow: 0 5px 0 var(--ember), 0 10px 0 var(--red), 0 15px 0 var(--blood), 0 20px 0 #000; }
#title .s { font-family: var(--head); font-size: clamp(12px, 1.6vw, 20px); letter-spacing: 6px; color: var(--gold); text-transform: uppercase; text-shadow: 0 2px 0 #000; }
#title.slam .h { animation: slam .32s cubic-bezier(.2,1.6,.4,1) both; }
#title.slam .s { animation: slam .32s .12s cubic-bezier(.2,1.6,.4,1) both; }
#title.out { opacity: 0; transition: opacity .18s; }
@keyframes slam { from { transform: scale(2.4); opacity: 0; filter: blur(6px); } 60% { opacity: 1; filter: none; } }
#vignette { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }
#bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--ember); z-index: 8; }
/* Start / end */
#start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  background: radial-gradient(ellipse at center, #1c1a2b, #000 75%); text-align: center; padding: 0 16px; }
#start h1 { margin: 0; font-family: var(--head); font-weight: 700; font-size: clamp(44px, 10vw, 120px); color: var(--gold); letter-spacing: 4px;
  text-shadow: 0 5px 0 var(--ember), 0 10px 0 var(--red), 0 15px 0 var(--blood), 0 20px 0 #000; }
#start p { margin: 0; color: var(--dim); font-size: clamp(16px, 2vw, 21px); }
.btn { font-family: var(--head); font-size: 22px; background: var(--ember); color: var(--void); border: 0; padding: 14px 40px; cursor: pointer;
  box-shadow: inset -4px -4px 0 #9b3b16, inset 4px 4px 0 #ffb070, 0 0 0 3px #000, 0 6px 0 3px #000; }
.btn:hover, .btn:focus-visible { filter: brightness(1.1); outline: none; transform: translateY(-2px); }
#mute { position: fixed; top: 12px; right: 12px; z-index: 21; font-family: var(--head); font-size: 12px; background: rgba(11,10,18,.8); color: var(--ink); border: 2px solid #5e557f; padding: 6px 10px; cursor: pointer; }
</style>
</head>
<body>
<div id="frame">
  <div id="vignette"></div>
  <div id="shield"></div>
  <div id="title"></div>
  <div id="flash"></div>
  <div id="bar"></div>
</div>
<button id="mute">Sound on</button>
<div id="start">
  <h1>ROGUE SURVIVORS 3</h1>
  <p>40-second trailer · live gameplay</p>
  <button class="btn" id="go">Play trailer</button>
</div>
<script>
'use strict';
/* Fast-cut trailer. Each shot is the real game, preloaded a few cuts ahead in a hidden frame so cuts are instant.
   Cuts land on the beat of a small WebAudio score. */
const BPM = 140, BEAT = 60 / BPM;
const code = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');
const SHOTS = [
  { beats: 7, url: 'auto=vesper&t=540&lv=24&evo=1&god=1', h: 'THE SUN IS DEAD', s: '' },
  { beats: 5, url: 'auto=isolde&t=720&lv=30&evo=1&god=1', h: 'SURVIVE', s: 'the long night' },
  { beats: 5, url: 'auto=sable&t=660&lv=28&evo=1&god=1', h: 'EVOLVE', s: '12 weapons · 8 heroes' },
  { beats: 5, url: 'auto=brask&t=480&lv=14&god=1&fuse=glaive,chain&fuseAt=900', h: 'FUSE SUPER WEAPONS', s: 'or shatter them' },
  { beats: 5, url: 'auto=pell&shrine=600&open=1&god=1&calm=1', h: 'GAMBLE', s: 'shrines of chance' },
  { beats: 6, url: 'auto=wren&god=1&calm=1&goto=town', h: 'EXPLORE', s: 'towns · temples · towers' },
  { beats: 5, url: 'auto=wren&god=1&theme=crypt', h: 'RAID DUNGEONS', s: '', dungeon: true },
  { beats: 5, url: 'auto=pell&god=1&lv=12&dim=rift', h: 'CROSS DIMENSIONS', s: '' },
  { beats: 5, url: 'auto=morrow&god=1&lv=14&calm=1&boss=colossus', h: 'SLAY TITANS', s: '', boss: true },
  { beats: 4, url: 'auto=nyx&god=1&lv=14&calm=1&boss=wyrm', h: '', s: '', boss: true },
  { beats: 5, url: 'auto=isolde&god=1&lv=18&calm=1&boss=herald', h: '14 BOSSES', s: 'no mercy', boss: true },
  { beats: 6, url: 'story=0&god=1', h: '', s: '', story: true },
  { beats: 7, coop: true, h: 'PLAY TOGETHER', s: 'online co-op · room codes' },
  { beats: 10, url: 'auto=vesper&t=600&lv=26&evo=1&god=1', h: 'ROGUE SURVIVORS 3', s: 'survive the long night', gold: true, end: true },
];
const $ = id => document.getElementById(id);
const frame = $('frame');
let muted = false, live = false, idx = -1, t0 = 0, slots = [], ac = null, master = null, musicTimer = null;
const SAVED = {};
for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); SAVED[k] = localStorage.getItem(k); }
const restoreSave = () => { try { for (const k in SAVED) localStorage.setItem(k, SAVED[k]); } catch (e) { /* storage blocked */ } };
addEventListener('pagehide', restoreSave);

/* Autopilot inside each game frame: kite the horde, fight bosses up close, play dungeons, answer menus fast */
const PILOT = o => `(() => {
  const o = ${JSON.stringify(o)};
  openPause = function () {};
  let since = performance.now(), last = state, wander = Math.random() * 6.28, stuck = 0, lx = 0, ly = 0, dir = 1, nextJump = 0, nextHit = 0, pulled = false, orbit = Math.random() < 0.5 ? 1 : -1;
  const press = (code, ms = 90) => { dispatchEvent(new KeyboardEvent('keydown', { code })); setTimeout(() => dispatchEvent(new KeyboardEvent('keyup', { code })), ms); };
  const setMove = (x, y) => { keys.KeyA = x < -0.35; keys.KeyD = x > 0.35; keys.KeyW = y < -0.35; keys.KeyS = y > 0.35; };
  setInterval(() => { try {
    const now = performance.now();
    if (state !== last) { last = state; since = now; setMove(0, 0); }
    const held = now - since;
    if (state === 'levelup' && held > 350) { if (Net.role === 'guest') guestPick(0); else pickChoice(0); }
    else if (state === 'chest' && held > 400 && !$('btnChest').disabled) revealChest();
    else if (state === 'shrine' && held > 700 && !shrineSpinning) { since = now; if (!$('btnPull').disabled) pullShrine(); }
    else if (state === 'modal' && held > 1600 && !o.fuse) closeModal();
    else if (state === 'dialogue' && DLG && held > 1400) { advanceDialogue(); advanceDialogue(); since = now; }
    else if (state === 'dungeon' && DP) {
      keys.KeyD = dir > 0; keys.KeyA = dir < 0;
      if (Math.abs(DP.x - lx) < 0.5) { if (++stuck > 12) { dir = -dir; stuck = 0; press('Space', 260); } } else stuck = 0;
      lx = DP.x;
      if (now > nextJump) { press('Space', 200 + Math.random() * 200); nextJump = now + 800 + Math.random() * 1000; }
      if (now > nextHit) { press('KeyJ'); nextHit = now + 300; }
    } else if (state === 'play' && ME && G) {
      let vx, vy;
      const b = G.boss && !G.boss.dead ? G.boss : null;
      if (b) {
        // fight the boss: pull it into frame once, then circle it at striking range
        if (!pulled) { pulled = true; b.x = ME.x + 90; b.y = ME.y - 30; }
        const dx = b.x - ME.x, dy = b.y - ME.y, d = Math.hypot(dx, dy) || 1, want = 64;
        vx = -dy / d * orbit + dx / d * (d - want) / 25; vy = dx / d * orbit + dy / d * (d - want) / 25;
      } else {
        wander += (Math.random() - 0.5) * 0.3;
        vx = Math.cos(wander) * 0.8; vy = Math.sin(wander) * 0.8;
        for (const e of G.enemies) {
          if (e.prop || e.dead) continue;
          const dx = ME.x - e.x, dy = ME.y - e.y, d2 = dx * dx + dy * dy;
          if (d2 < 6000 && d2 > 1) { vx += dx * 22 / d2; vy += dy * 22 / d2; }
        }
      }
      if (Math.hypot(ME.x - lx, ME.y - ly) < 0.3) { if (++stuck > 8) { wander += 2.4; orbit = -orbit; stuck = 0; } } else stuck = 0;
      lx = ME.x; ly = ME.y;
      if (o.still) { vx *= 0.15; vy *= 0.15; }
      setMove(vx, vy);
    }
  } catch (e) { /* still loading */ } }, 80);
  Snd.init(); Snd.setVol('mus', 0); Snd.setVol('sfx', 0);
  const st = document.createElement('style'); st.textContent = '#mute, #banner { display: none !important; }' + (o.end ? '#hud { opacity: .35; }' : ''); document.head.appendChild(st);
})()`;

function makeSlot(i) {
  const s = SHOTS[i], el = document.createElement('div');
  el.className = 'slot' + (s.coop ? ' split' : '');
  const f1 = document.createElement('iframe'); f1.setAttribute('allow', 'autoplay'); el.appendChild(f1);
  const frames = [f1];
  const inj = f => { try { f.contentWindow.eval(PILOT({ ...s, fuse: /fuse/.test(s.url || ''), still: /goto=town|shrine/.test(s.url || '') })); } catch (e) { /* not ready */ } };
  if (s.coop) {
    const c = code(), f2 = document.createElement('iframe'); f2.setAttribute('allow', 'autoplay'); el.appendChild(f2); frames.push(f2);
    f1.onload = () => { inj(f1); f2.src = `index.html?coopjoin=${c}&char=isolde&god=1`; };
    f2.onload = () => inj(f2);
    f1.src = `index.html?coophost=${c}&char=wren&god=1`;
  } else { f1.onload = () => inj(f1); f1.src = 'index.html?' + s.url; }
  frame.insertBefore(el, $('vignette'));
  return { el, frames };
}
function setSfx(slot, on) { for (const f of slot.frames) try { f.contentWindow.Snd.setVol('sfx', on && !muted ? 0.45 : 0); } catch (e) { /* loading */ } }

function cut(i) {
  idx = i;
  const s = SHOTS[i];
  // keep two shots ahead loading, and the co-op pair three ahead (it needs to connect)
  for (let k = i; k <= i + 3 && k < SHOTS.length; k++) if (!slots[k] && (k <= i + 2 || SHOTS[k].coop)) slots[k] = makeSlot(k);
  slots.forEach((sl, k) => { if (!sl) return; sl.el.classList.toggle('on', k === i); setSfx(sl, k === i); if (k < i - 1) { sl.el.remove(); slots[k] = null; } });
  $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
  frame.classList.remove('shake'); void frame.offsetWidth; if (s.h) frame.classList.add('shake');
  const T = $('title');
  T.className = '';
  T.innerHTML = s.h ? `<div class="h${s.gold ? ' gold' : ''}">${s.h}</div>${s.s ? `<div class="s">${s.s}</div>` : ''}` : '';
  void T.offsetWidth; if (s.h) { T.classList.add('slam'); hit(); }
  if (s.h && !s.end) setTimeout(() => { if (idx === i) T.classList.add('out'); }, s.beats * BEAT * 1000 * 0.62);
}

/* ---------- Score: kick, snare, bass and an impact on every title ---------- */
function audio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ac.destination);
}
function env(node, t, a, d, peak) { node.gain.setValueAtTime(0.0001, t); node.gain.exponentialRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function kick(t) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.18); env(g, t, 0.003, 0.25, 0.9); o.connect(g).connect(master); o.start(t); o.stop(t + 0.3); }
let noiseBuf = null;
function noise(t, dur, freq, peak) {
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; env(g, t, 0.003, dur, peak);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + 0.05);
}
function bass(t, f, dur) { const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = 420; env(g, t, 0.01, dur, 0.35); o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05); }
function lead(t, f, dur) { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = f; env(g, t, 0.01, dur, 0.07); o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05); }
function hit() {
  if (!ac) return;
  const t = ac.currentTime;
  noise(t, 0.5, 900, 0.6);
  const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.6); env(g, t, 0.005, 0.7, 0.9); o.connect(g).connect(master); o.start(t); o.stop(t + 0.8);
}
const ROOTS = [55, 55, 43.65, 49, 55, 55, 41.2, 49]; // A A F G A A E G
const MEL = [440, 523.25, 587.33, 659.25, 587.33, 523.25, 493.88, 523.25];
function scheduleMusic(start) {
  let step = 0;
  const total = SHOTS.reduce((a, s) => a + s.beats, 0) * 2;
  const tick = () => {
    while (step < total && start + step * BEAT / 2 < ac.currentTime + 0.25) {
      const t = start + step * BEAT / 2, beat = step >> 1, bar = beat >> 2;
      if (step % 2 === 0) { kick(t); if (beat % 2) noise(t, 0.16, 2200, 0.45); }
      else noise(t, 0.04, 8000, 0.12);
      bass(t, ROOTS[bar % 8] * (step % 4 === 3 ? 2 : 1), BEAT / 2 * 0.9);
      if (bar >= 4 && step % 2 === 0) lead(t, MEL[(beat + bar) % 8] / (bar % 2 ? 1 : 2), BEAT * 0.45);
      step++;
    }
    if (step < total) musicTimer = setTimeout(tick, 60);
  };
  tick();
}

/* ---------- Playback ---------- */
function play() {
  restoreSave();
  slots.forEach(sl => sl && sl.el.remove()); slots = [];
  $('start').style.display = 'none';
  audio(); if (ac.state === 'suspended') ac.resume();
  clearTimeout(musicTimer);
  // preload the first shots while the title holds black for a beat
  for (let k = 0; k < 3; k++) slots[k] = makeSlot(k);
  const begin = performance.now() + 1500;
  live = true; idx = -1;
  setTimeout(() => {
    t0 = performance.now();
    scheduleMusic(ac.currentTime + 0.02);
    let acc = 0;
    SHOTS.forEach((s, i) => { setTimeout(() => { if (live) cut(i); }, acc * BEAT * 1000); acc += s.beats; });
    setTimeout(finish, acc * BEAT * 1000);
  }, begin - performance.now());
}
function finish() {
  live = false;
  restoreSave();
  slots.forEach(sl => sl && sl.el.remove()); slots = [];
  $('title').innerHTML = ''; $('bar').style.width = '0';
  $('start').querySelector('p').textContent = 'Every shot was the real game, running live.';
  $('go').textContent = 'Watch again';
  $('start').style.display = '';
}
const TOTAL = SHOTS.reduce((a, s) => a + s.beats, 0) * BEAT;
(function progress() { if (live && idx >= 0) $('bar').style.width = Math.min(100, (performance.now() - t0) / 10 / TOTAL) + '%'; requestAnimationFrame(progress); })();
$('go').onclick = play;
$('mute').onclick = () => {
  muted = !muted; $('mute').textContent = muted ? 'Sound off' : 'Sound on';
  if (master) master.gain.value = muted ? 0 : 0.55;
  if (slots[idx]) setSfx(slots[idx], true);
};
</script>
</body>
</html>
